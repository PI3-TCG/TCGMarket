spring:
  application:
    name: backend
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true

# O segredo precisa ter pelo menos 32 bytes em UTF-8. A validade padrão é de 24 horas.
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}

# Catálogos externos. A chave da Pokémon TCG vem só do ambiente e não tem valor padrão.
external-apis:
  pokemon:
    base-url: ${POKEMON_TCG_BASE_URL:https://api.pokemontcg.io/v2}
    api-key: ${POKEMON_TCG_API_KEY:}
    timeout: ${POKEMON_TCG_TIMEOUT:10s}
  yugioh:
    base-url: ${YUGIOH_API_BASE_URL:https://db.ygoprodeck.com/api/v7}
    timeout: ${YUGIOH_API_TIMEOUT:10s}
  mtg:
    base-url: ${MTG_API_BASE_URL:https://api.scryfall.com}
    timeout: ${MTG_API_TIMEOUT:10s}
