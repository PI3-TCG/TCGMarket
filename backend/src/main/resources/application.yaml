spring:
  application:
    name: backend
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true

# O segredo precisa ter pelo menos 32 bytes em UTF-8. A validade padrão é de 24 horas.
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}
  # Conta já cadastrada que vira ADMIN na subida da aplicação. Vazio não promove ninguém.
  admin:
    email: ${ADMIN_EMAIL:}

# Origens aceitas pelo CORS, separadas por vírgula. O padrão aberto serve só para desenvolvimento.
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}

# Catálogos externos. A chave da Pokémon TCG vem só do ambiente e não tem valor padrão.
external-apis:
  pokemon:
    base-url: ${POKEMON_TCG_BASE_URL:https://api.pokemontcg.io/v2}
    api-key: ${POKEMON_TCG_API_KEY:}
    timeout: ${POKEMON_TCG_TIMEOUT:10s}
  yugioh:
    base-url: ${YUGIOH_API_BASE_URL:https://db.ygoprodeck.com/api/v7}
    timeout: ${YUGIOH_API_TIMEOUT:10s}
  mtg:
    base-url: ${MTG_API_BASE_URL:https://api.scryfall.com}
    timeout: ${MTG_API_TIMEOUT:10s}

# Pagamento. "simulated" não acessa a rede; "mercadopago" usa o sandbox com credenciais de teste.
payment:
  provider: ${PAYMENT_PROVIDER:simulated}
  simulated:
    # Resultado de toda cobrança do simulador: approved, rejected ou pending.
    outcome: ${PAYMENT_SIMULATED_OUTCOME:approved}
  mercadopago:
    base-url: ${MP_BASE_URL:https://api.mercadopago.com}
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    notification-url: ${MP_NOTIFICATION_URL:}
    # No sandbox, o nome do pagador define o cenário do Pix de teste (APRO aprova).
    test-payer-name: ${MP_TEST_PAYER_NAME:APRO}
    timeout: ${MP_TIMEOUT:10s}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    interval: ${PAYMENT_RECONCILIATION_INTERVAL:1m}
    pending-after: ${PAYMENT_RECONCILIATION_PENDING_AFTER:2m}
