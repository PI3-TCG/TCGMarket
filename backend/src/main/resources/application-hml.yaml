# Homologação na EC2, atrás do proxy reverso. As variáveis vêm do arquivo de ambiente do servidor.
server:
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

# Sem valor padrão: a aplicação não sobe em HML com CORS aberto.
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
