# Serviço independente: não altera o Mongo nem o volume usados no desenvolvimento.
services:
  mongodb-test:
    image: mongo:8
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
